services:
  backend:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server/db:/app/db
    networks:
      - cftunnel
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => { r.statusCode === 200 ? process.exit(0) : process.exit(1) });",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      cftunnel:
        ipv4_address: 172.100.0.61

  frontend:
    build: ./client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      cftunnel:
        ipv4_address: 172.200.0.57

networks:
  cftunnel:
    external: true
