services:
  backend:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server/db:/app/db
    networks:
      - cashball-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => { r.statusCode === 200 ? process.exit(0) : process.exit(1) });",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backups:
    # Snapshots periódicos de todas as bases (Online Backup API — seguro com o
    # server ativo). Intervalo via BACKUP_INTERVAL_HOURS; retenção via
    # RETENTION_COUNT. Snapshots em ./backups/YYYYMMDD_HHMMSS/.
    build: ./server
    restart: unless-stopped
    environment:
      BACKUP_DIR: /app/backups
      RETENTION_COUNT: "7"
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - ./server/db:/app/db
      - ./backups:/app/backups
    networks:
      - cashball-net
    command: >-
      sh -c 'while true; do node scripts/backupDatabases.js || echo "[backups] cycle failed — retrying next interval"; sleep $${BACKUP_INTERVAL_HOURS:-24}h; done'

  frontend:
    build: ./client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      cashball-net:
      cftunnel:
        ipv4_address: 172.100.0.57

networks:
  cftunnel:
    external: true
  cashball-net:
    driver: bridge
