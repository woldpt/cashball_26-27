<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3d24"/>
      <stop offset="100%" stop-color="#04140d"/>
    </linearGradient>
    <radialGradient id="m-hl" cx="28%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#95d4b3" stop-opacity="0.22"/>
      <stop offset="54%" stop-color="#95d4b3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e8a0"/>
      <stop offset="48%" stop-color="#e9c349"/>
      <stop offset="100%" stop-color="#c9a52a"/>
    </linearGradient>
    <linearGradient id="m-gold-hi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.38"/>
      <stop offset="44%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="m-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.8" stdDeviation="3.0" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <!-- Fundo quadrado total (maskable precisa preencher tudo) -->
  <rect width="128" height="128" fill="url(#m-bg)"/>
  <rect width="128" height="128" fill="url(#m-hl)"/>
  <!-- Bola ligeiramente menor para zona segura (safe zone 80%) -->
  <circle cx="64" cy="64.4" r="36.5" fill="#f7fffa" filter="url(#m-sh)"/>
  <circle cx="64" cy="64.4" r="36.5" fill="none" stroke="#0a1e14" stroke-opacity="0.07" stroke-width="0.9"/>
  <g stroke="#0a2e1a" stroke-width="4.8" stroke-linecap="round">
    <line x1="64" y1="42.2" x2="64" y2="28.4"/>
    <line x1="84.05" y1="56.1" x2="96.8" y2="51.4"/>
    <line x1="76.55" y1="78.15" x2="84.85" y2="90.8"/>
    <line x1="51.45" y1="78.15" x2="43.15" y2="90.8"/>
    <line x1="43.95" y1="56.1" x2="31.2" y2="51.4"/>
  </g>
  <polygon points="64,42.2 44.25,56.5 51.95,78.3 76.05,78.3 83.75,56.5" fill="url(#m-gold)" stroke="#8a7518" stroke-opacity="0.42" stroke-width="0.85" stroke-linejoin="round"/>
  <polygon points="64,42.2 44.25,56.5 51.95,78.3 76.05,78.3 83.75,56.5" fill="url(#m-gold-hi)"/>
  <polygon points="64,42.2 44.25,56.5 51.95,78.3 76.05,78.3 83.75,56.5" fill="none" stroke="#0a2e1a" stroke-opacity="0.16" stroke-width="0.65" stroke-linejoin="round"/>
  <g transform="translate(64.6, 62.3) scale(1.68)">
    <path fill="#0a2e1a" d="M 6.36 -7.06 A 9.5 9.5 0 1 0 6.36 7.06 L 2.88 3.20 A 4.3 4.3 0 1 1 2.88 -3.20 Z M -10.6 -7.2 H 5 V -2 H -10.6 Z M -10.6 7.2 H 5 V 2 H -10.6 Z"/>
  </g>
